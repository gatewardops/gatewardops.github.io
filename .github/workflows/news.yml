name: Daily news

on:
  schedule:
    - cron: "15 5 * * *"   # every day at 05:15 UTC
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write           # needed to commit data/news.json

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch headlines
        run: python scripts/fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update daily news"
            git push
          fi
